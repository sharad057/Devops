name: Demo CI Env Secrets

on:
  # push:
    workflow_dispatch


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Say Hello
        run: echo "Hello from the second workflow!"

      - name: Install
        env:
          APP_ENV: demo
        run: echo "Environment $APP_ENV"

      - name: Create demo file
        run: |
          echo "Hello from CI Pipeline" > demo.txt
          echo "File created successfully"

      - name: Upload Demo
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-demo
          path: demo.txt

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Test Job
        run: echo "TestJob"