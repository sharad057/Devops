name: Demo CI Env Secrets

on: 
    # push
    workflow_dispatch

jobs:
    build: 
        runs-on: ubuntu-latest

        steps:
            - name: Say Hello
              run: echo "Hello from the second workflow!"

            - name: Install
              env: 
                APP_ENV: demo
              run: echo "Enviroment $APP_ENV"

            - name: Create demo file
              run: |
                echo "Hello from CI Pipeline" > demo.txt
                echo "File created successfully"



            - name: Upload Demo
              uses: actions/upload-artifact@v4
              with:
                name: build-artifacts-demo
                path: .