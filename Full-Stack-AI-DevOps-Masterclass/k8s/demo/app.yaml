apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          imagePullPolicy: Always

          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MESSAGE

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web

spec:
  type: NodePort
  selector:
    app: web

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30890